name: Generate planning demo

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_rrt_demo.py"
      - "planners/geometric_rrt.py"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - run: python scripts/generate_rrt_demo.py
      - name: Commit generated demo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rrt-replanning-demo.gif
          git diff --cached --quiet || git commit -m "Update RRT replanning demo"
          git push
